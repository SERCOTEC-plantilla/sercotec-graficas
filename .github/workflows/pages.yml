name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sólo archivos públicos de la aplicación
        run: |
          mkdir -p public/icons
          cp index.html pwa.js sw.js manifest.webmanifest public/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png public/icons/
          touch public/.nojekyll
      - name: Subir sitio (archivo estático, sin Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
